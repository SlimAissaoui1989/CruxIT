name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CruxIT.sln

      - name: Pack all library projects
        run: |
          dotnet pack CruxIT.Library/CruxIT.Library.csproj --configuration Release --no-restore -p:PackageVersion=${{ steps.version.outputs.value }} -p:GeneratePackageOnBuild=false --output ./artifacts
          dotnet pack CruxIT.Library.DataToolkit/CruxIT.Library.DataToolkit.csproj --configuration Release --no-restore -p:PackageVersion=${{ steps.version.outputs.value }} -p:GeneratePackageOnBuild=false --output ./artifacts
          dotnet pack CruxIT.Library.API/CruxIT.Library.API.csproj --configuration Release --no-restore -p:PackageVersion=${{ steps.version.outputs.value }} -p:GeneratePackageOnBuild=false --output ./artifacts

      - name: Publish packages
        run: dotnet nuget push "./artifacts/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
